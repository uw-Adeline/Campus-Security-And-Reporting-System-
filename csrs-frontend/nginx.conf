server {
    listen 80;
    server_name localhost;

    # Root directory where Vue build files are located
    root /usr/share/nginx/html;
    index index.html;

    # Handle Vue Router — redirect all routes to index.html
    # Without this, refreshing /admin would give a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Spring Boot backend
    # When frontend calls /api/..., Nginx forwards it to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets (JS, CSS, images) for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
